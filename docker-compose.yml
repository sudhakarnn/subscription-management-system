services:
  postgres:
    image: postgres:16-alpine
    container_name: brightloop_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brightloop_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brightloop_secret}
      POSTGRES_DB: ${POSTGRES_DB:-brightloop_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brightloop_admin} -d ${POSTGRES_DB:-brightloop_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
